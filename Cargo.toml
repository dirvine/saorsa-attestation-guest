[package]
name = "saorsa-attestation-guest"
version = "0.1.0"
edition = "2021"
authors = ["Saorsa Labs Limited <david@saorsalabs.com>"]
license = "MIT OR Apache-2.0"
description = "SP1 zkVM guest program for Saorsa Entangled Attestation proofs"
homepage = "https://github.com/dirvine/saorsa-attestation-guest"
repository = "https://github.com/dirvine/saorsa-attestation-guest"
keywords = ["zkvm", "sp1", "attestation", "saorsa", "zero-knowledge"]
categories = ["cryptography", "no-std"]
readme = "README.md"

# ============================================================================
# SP1 Guest Program Configuration
# ============================================================================
# This crate compiles to a RISC-V ELF binary that runs inside the SP1 zkVM.
# The guest program proves correct derivation of EntangledId without revealing
# private inputs (full public key, nonce).
# ============================================================================

[dependencies]
# SP1 zkVM guest library
sp1-zkvm = "4.0"

# Pure logic for attestation derivation (no_std compatible)
saorsa-logic = { version = "0.1", default-features = false, features = ["zkvm"] }

# Serialization for input/output
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

# BLAKE3 hashing (no_std compatible)
blake3 = { version = "1.5", default-features = false }

[profile.release]
# Optimize for SP1 cycle count
opt-level = 3
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# These are problematic in zkVM guest code
unwrap_used = "deny"
expect_used = "warn"  # Sometimes needed for zkVM assertions
panic = "warn"        # panic! is acceptable for constraint violations in zkVM
